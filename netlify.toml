[build]
  command = "npm run build:netlify"
  publish = "dist"

[build.environment]
  NODE_VERSION = "24"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[functions.shop]
  included_files = ["public/admin.html", "public/login.html", ".netlify/shop-assets.json"]

# Never turn missing API routes into a successful storefront response.
[[redirects]]
  from = "/admin/"
  to = "/admin"
  status = 301

