<!doctype html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Sign in — Shop manager</title><link rel="icon" href="/assets/mark.svg" type="image/svg+xml"><link rel="stylesheet" href="/styles.css"><script type="module" src="/login.js"></script></head>
<body class="login-page">
  <main class="login-main"><a href="/" class="wordmark"><img src="/assets/mark.svg" width="30" height="30" alt=""><span id="login-brand">Your shop</span></a><div class="login-intro"><h1>A little space<br>for your shop.</h1><p>Sign in to manage your collection.</p></div>
    <form id="login-form"><label for="password">Admin password</label><div class="password-field"><input id="password" name="password" type="password" required autocomplete="current-password" maxlength="256"><button id="toggle-password" type="button" aria-label="Show password">Show</button></div><p id="login-error" class="form-error" role="alert" hidden></p><button class="button button-dark" id="login-submit" type="submit">Sign in</button></form>
    <p class="login-help">This is your shop’s private dashboard. Use your setup password for your first sign-in, then choose your own in Shop settings.</p><a class="underlined-link" href="/">Back to the shop</a>
  </main>
</body></html>
